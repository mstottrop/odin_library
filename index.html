<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin Library</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="mainWrapper">
      <div class="header">
        <div class="headerButton">
          <span class="iconify" data-icon="mdi-book-plus"></span>
        </div>
        <div class="headerTitle">
          <p>BetterReads - a library build just for you!</p>
        </div>
      </div>
      <div class="sidebar">
        <div class="buttonDiv">
          <p>This is a sidebar</p>
          <button id="showDialog">Add books</button>
        </div>
      </div>
      <div class="bookWrapper"></div>
      <div class="buttonWrapper">
        <dialog id="dialog">
          <form method="dialog">
            <p>
              <label>
                What is the name of the book?
                <input type="text" class="titleInput" />
              </label>
              <label>
                What is the author of the book?
                <input type="text" class="authorInput" />
              </label>
              <label>
                How many pages does the book have?
                <input type="text" class="pagesInput" />
              </label>
              <label>
                Did you already read the book?
                <input type="text" class="completionInput" />
              </label>
            </p>
            <div>
              <input type="submit" id="closeBtn" value="Close" />
            </div>
          </form>
        </dialog>
        <p></p>
        <!-- <output></output> -->
      </div>
    </div>
    <script src="scripts.js"></script>
    <script src="//code.iconify.design/1/1.0.6/iconify.min.js"></script>
  </body>
</html>
